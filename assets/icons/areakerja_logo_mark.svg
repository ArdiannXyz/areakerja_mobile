<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <defs>
    <!-- Gradients for 3D ribbon effect -->
    <linearGradient id="akGradA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D2E" />
      <stop offset="60%" stop-color="#FF6300" />
      <stop offset="100%" stop-color="#E64500" />
    </linearGradient>
    
    <linearGradient id="akGradA2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D94000" />
      <stop offset="50%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#FFA036" />
    </linearGradient>

    <linearGradient id="akGradKTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E64A00" />
      <stop offset="40%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FFAE42" />
    </linearGradient>

    <linearGradient id="akGradKBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E04000" />
      <stop offset="50%" stop-color="#FF5D00" />
      <stop offset="100%" stop-color="#C23000" />
    </linearGradient>
    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#C23800" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- Bottom Connecting Arch of A -->
    <path d="M 28 88 C 28 88, 42 104, 68 88 C 82 79, 90 85, 92 92 C 94 99, 87 114, 66 114 C 38 114, 12 94, 28 66 Z" 
          fill="url(#akGradA2)" />

    <!-- Main Arch of A (Left Loop) -->
    <path d="M 22 72 C 14 54, 30 24, 52 24 C 70 24, 82 46, 68 76 C 56 102, 32 94, 22 72 Z" 
          fill="url(#akGradA1)" />
          
    <!-- Inner A Cutout / Fold -->
    <path d="M 38 64 C 32 54, 40 40, 50 40 C 58 40, 62 52, 54 66 C 46 76, 42 72, 38 64 Z" 
          fill="#FFFFFF" opacity="0.95" />

    <!-- Top Wing of K -->
    <path d="M 68 62 C 78 50, 96 28, 118 28 C 134 28, 142 42, 134 54 C 122 70, 96 74, 80 72 Z" 
          fill="url(#akGradKTop)" />

    <!-- Bottom Leg of K -->
    <path d="M 78 72 C 94 74, 124 74, 138 92 C 146 102, 136 116, 122 116 C 102 116, 84 94, 76 80 Z" 
          fill="url(#akGradKBot)" />
  </g>
</svg>
