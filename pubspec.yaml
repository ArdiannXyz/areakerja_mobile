name: areakerja_mobile
description: "AreaKerja Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  dio: ^5.7.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  dartz: ^0.10.1
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
